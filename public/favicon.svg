
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 40 40"
  width="40"
  height="40"
>
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Maçã -->
  <circle
    cx="20"
    cy="27"
    r="12"
    fill="#ef4444"
    filter="url(#shadow)"
  />

  <!-- Cabinho conectado ao topo -->
  <path
    d="M 17 16 L 11.5 7"
    stroke="#854d0e"
    stroke-width="3"
    stroke-linecap="round"
    fill="none"
    filter="url(#shadow)"
  />

  <!-- Folha inclinada para a direita -->
  <path
    d="M 15.5 16
       C 16 7, 23 3, 29 4
       C 29 11, 23 16, 15.5 14 Z"
    fill="#16a34a"
    stroke="#4b5563"
    stroke-width="1"
    stroke-linejoin="round"
    filter="url(#shadow)"
  />

  <!-- Brilho da maçã -->
  <rect
    x="13"
    y="24"
    width="4"
    height="6"
    rx="2"
    fill="#d1d5db"
    filter="url(#shadow)"
  />
</svg>
